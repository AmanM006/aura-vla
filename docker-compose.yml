version: '3.9'
services:
  hackathon:
    build: .
    ports:
      - '8000:8000'
    environment:
      - SPEECHMATICS_API_KEY=${SPEECHMATICS_API_KEY}
      - MUJOCO_GL=osmesa
    volumes:
      - ./models:/app/models  # mount trained model checkpoint
      - ./evidence:/app/evidence
    command: uvicorn dashboard.server:app --host 0.0.0.0 --port 8000
